    #flower-puzzle-inline *{box-sizing:border-box}
    #flower-puzzle-inline .fp-top{width:min(100%,360px);display:flex;align-items:center;justify-content:space-between;gap:10px}
    #flower-puzzle-inline h2{font-weight:500;margin:0;color:var(--foreground)}
    #flower-puzzle-inline .fp-count{color:var(--muted-foreground);white-space:nowrap}
    #flower-puzzle-inline .fp-intro{width:min(100%,360px);color:var(--muted-foreground);margin:0}
    #flower-puzzle-inline .fp-stage{width:min(100%,360px);position:relative}

    #flower-puzzle-inline .fp-tile:focus-visible{outline:3px solid var(--ring);outline-offset:1px}
    #flower-puzzle-inline .fp-tile.fp-movable{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 60%,transparent),0 3px 8px color-mix(in srgb,var(--foreground) 15%,transparent)}
    #flower-puzzle-inline .fp-gap{background:color-mix(in srgb,var(--accent) 15%,var(--card));border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--border))}
    #flower-puzzle-inline .fp-full{position:absolute;inset:6px;background-image:var(--puzzle-art);background-position:center;background-size:cover;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .5s ease}
    #flower-puzzle-inline .fp-full.fp-show{opacity:1}
    #flower-puzzle-inline .fp-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(100%,360px)}
    #flower-puzzle-inline .fp-actions .btn{min-height:44px}
    #flower-puzzle-inline .fp-message{min-height:1.5em;color:var(--muted-foreground);text-align:center}
    #flower-puzzle-inline .fp-reward{display:none;align-items:center;flex-direction:column;text-align:center;gap:8px;width:min(100%,360px);padding:14px;background:var(--card);border:1px solid var(--border);border-radius:18px}
    #flower-puzzle-inline .fp-reward.fp-show{display:flex}
    #flower-puzzle-inline .fp-reward img{width:min(62%,190px);height:auto;aspect-ratio:1;object-fit:contain}
    #flower-puzzle-inline .fp-reward h3{font-weight:500;margin:0}
    #flower-puzzle-inline .fp-reward p{margin:0;color:var(--foreground)}
    #flower-puzzle-inline .fp-deco{position:absolute;right:-8px;top:-32px;font-size:28px;transform:rotate(15deg);pointer-events:none}
    #flower-puzzle-inline .fp-photo{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--foreground) 45%,transparent);padding:10px}
    #flower-puzzle-inline .fp-photo[hidden]{display:none}
    #flower-puzzle-inline .fp-photo-card{width:min(100%,340px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 14px 40px color-mix(in srgb,var(--foreground) 25%,transparent);animation:fp-pop .35s cubic-bezier(.2,1.3,.3,1) both}
    #flower-puzzle-inline .fp-photo-card img{display:block;width:100%;height:auto;max-height:290px;object-fit:contain;border-radius:12px}
    #flower-puzzle-inline .fp-photo-card h3{margin:0;font-weight:500}
    @keyframes fp-pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
    @media(max-width:390px){#flower-puzzle-inline{padding:12px 0 16px}#flower-puzzle-inline .fp-top,#flower-puzzle-inline .fp-intro,#flower-puzzle-inline .fp-stage,#flower-puzzle-inline .fp-actions,#flower-puzzle-inline .fp-reward{width:100%}}
    @media(prefers-reduced-motion:reduce){#flower-puzzle-inline .fp-full{transition:none}}
  </style>

  <script>
  (()=>{
    const root=document.getElementById('flower-puzzle-inline');
    const board=root.querySelector('.fp-board');
    const full=root.querySelector('.fp-full');
    const count=root.querySelector('.fp-count');
    const message=root.querySelector('.fp-message');
    const reward=root.querySelector('.fp-reward');
    const gif=reward.querySelector('img');
    const gifData=gif.getAttribute('data-src');
    const caption=reward.querySelector('p');
    const photo=root.querySelector('.fp-photo');
    const goodWords=['ມື້ນີ້ເຈົ້າເກັ່ງຫຼາຍແລ້ວ 🌷','ຍິ້ມໃຫ້ຕົວເອງແນ່ເດີ້ 💛','ຄ່ອຍໆໄປກໍໄດ້ ເຈົ້າກຳລັງໄປໄດ້ດີ 🌼','ເຈົ້າມີຄຸນຄ່າສະເໝີ 🌻'];
    let cells=[],moves=0,won=false,previous=-1,peekTimer,photoTimer;
    const near=i=>[i-3,i+3,i-1,i+1].filter(n=>n>=0&&n<9&&(Math.abs(n-i)===3||(Math.floor(i/3)===Math.floor(n/3)&&Math.abs(n-i)===1)));
    const solved=()=>cells.every((n,i)=>n===(i+1)%9);
    function render(){const empty=cells.indexOf(0);board.replaceChildren();cells.forEach((n,i)=>{if(!n){const gap=document.createElement('div');gap.className='fp-gap';gap.setAttribute('aria-label','ຊ່ອງວ່າງ');board.append(gap);return;}const tile=document.createElement('button');tile.type='button';tile.className='fp-tile cursor-interaction'+(near(empty).includes(i)?' fp-movable':'');tile.textContent=String(n);tile.setAttribute('aria-label','ຊິ້ນຮູບ '+n);tile.style.backgroundPosition=((n-1)%3*50)+'% '+(Math.floor((n-1)/3)*50)+'%';tile.addEventListener('click',()=>move(i));board.append(tile)});count.textContent='ຍ້າຍ '+moves+' ຄັ້ງ';}
    function move(i){if(won)return;const empty=cells.indexOf(0);if(!near(empty).includes(i)){message.textContent='ກະຕ່າຍໂດດບໍ່ເຖິງຊິ້ນນັ້ນ 😜';return;}[cells[i],cells[empty]]=[cells[empty],cells[i]];moves++;message.textContent='';render();if(solved()){won=true;full.classList.add('fp-show');message.textContent='ເກັ່ງຫຼາຍ! 🎉';photo.hidden=false;photoTimer=setTimeout(showReward,1700);}}
    function showReward(){if(!won)return;photo.hidden=true;reward.classList.add('fp-show');gif.removeAttribute('src');gif.src=gifData;gif.hidden=false;caption.textContent=goodWords[Math.floor(Math.random()*goodWords.length)];caption.hidden=false;}
    function restart(){clearTimeout(photoTimer);cells=[1,2,3,4,5,6,7,8,0];previous=-1;for(let j=0;j<12;j++){const empty=cells.indexOf(0);const options=near(empty).filter(n=>n!==previous);const next=options[Math.floor(Math.random()*options.length)];[cells[next],cells[empty]]=[cells[empty],cells[next]];previous=empty;}if(solved()){const empty=cells.indexOf(0),next=near(empty)[0];[cells[next],cells[empty]]=[cells[empty],cells[next]];}moves=0;won=false;message.textContent='';full.classList.remove('fp-show');reward.classList.remove('fp-show');photo.hidden=true;gif.hidden=true;caption.hidden=true;render();}
    root.querySelector('[data-action="restart"]').addEventListener('click',restart);
    root.querySelector('[data-action="hint"]').addEventListener('click',()=>{if(won)return;full.classList.add('fp-show');message.textContent='ແອບເບິ່ງໄດ້ ແຕ່ຢ່າບອກກະຕ່າຍເດີ້ 🤫';clearTimeout(peekTimer);peekTimer=setTimeout(()=>{if(!won)full.classList.remove('fp-show')},1300)});
    restart();
  })();
  </script>
</div>
